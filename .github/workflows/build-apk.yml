name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
          cache-encryption-key: ""
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon
          echo "=== 查找APK ==="
          find . -name "*.apk" -type f 2>/dev/null
          echo "=== 构建输出目录 ==="
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "debug目录不存在"
          ls -la app/build/outputs/apk/ 2>/dev/null || echo "apk目录不存在"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: "**/*.apk"
