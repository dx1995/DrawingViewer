name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "=== SDK 目录 ==="
          ls $ANDROID_HOME/platforms/ 2>/dev/null || echo "无platforms"
          ls $ANDROID_HOME/build-tools/ 2>/dev/null || echo "无build-tools"
          echo "=== project结构 ==="
          ls -la

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
          echo "=== 查找APK ==="
          find . -name "*.apk" -type f 2>/dev/null
          echo "=== 构建输出目录 ==="
          ls -la app/build/outputs/apk/ 2>/dev/null || echo "apk目录不存在"

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: "**/*.apk"
